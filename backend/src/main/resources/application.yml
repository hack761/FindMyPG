server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  servlet.multipart.max-file-size: 8MB
  servlet.multipart.max-request-size: 8MB
  application.name: findmypg-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/findmypg}
    username: ${DATABASE_USER:findmypg}
    password: ${DATABASE_PASSWORD:findmypg}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  jwt:
    issuer: findmypg
    secret: ${JWT_SECRET:local-development-secret-change-before-deploying-32-bytes-minimum}
    ttl: PT12H
  cookie.secure: ${COOKIE_SECURE:false}
  cors.origins: ${CORS_ORIGINS:http://localhost:4200}
  demo-seed: ${DEMO_SEED:true}
