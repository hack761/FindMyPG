services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: findmypg
      POSTGRES_USER: findmypg
      POSTGRES_PASSWORD: findmypg
    ports:
      - "5432:5432"
    volumes:
      - findmypg-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findmypg -d findmypg"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  findmypg-postgres:
